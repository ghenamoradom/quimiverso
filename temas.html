<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco de temas · Quimiverso</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"><link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/estilo.css">
<style>
/* Banco de temas: título y cuadrícula de botones temáticos */
.intro{padding:48px 0 24px;display:flex;flex-direction:column;gap:10px}
.intro h1{font-size:clamp(32px,5vw,48px)}
.intro p{color:var(--muted);font-size:17px;max-width:56ch}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px;padding-bottom:20px}
.tema{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s,box-shadow .15s;min-height:190px}
.tema:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 10px 24px rgba(22,32,42,.08)}
.tema .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--acc-soft);color:var(--c1)}
.tema .ic svg{width:30px;height:30px}
.tema h2{font-size:21px}
.tema .st{margin-top:auto;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tema .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line2)}
.tema.on{border-color:var(--c1)}
.tema.on .ic{background:var(--c1);color:#fff}
.tema.on .st{color:var(--c1)}
.tema.on .st::before{background:var(--c1)}
@media (prefers-reduced-motion:reduce){.tema{transition:none}.tema:hover{transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><img src="assets/img/logo-quimiverso.png" alt="Quimiverso" width="140" height="45"></a>
  <div class="user" id="user" style="margin-left:auto"></div>
</div></header>

<main class="wrap">
  <section class="intro">
    <p class="eyebrow">Química · Aprendizaje autónomo</p>
    <h1>Banco de temas</h1>
    <p>Elige un tema para empezar. Cada uno reúne clases, simuladores, laboratorios virtuales y retos para avanzar a tu ritmo.</p>
  </section>
  <div class="temas" id="temas"></div>
</main>
<footer class="foot"><div class="wrap"><span>Quimiverso · IE Juan XXIII · Prof. Germán Holland Enamorado Montes</span><span><a href="docente.html">Acceso docente</a></span></div></footer>
<script src="config.js"></script>
<script src="assets/comun.js"></script>

<script>
const I = {
  gases:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="10" r="3"/><circle cx="22" cy="8" r="2"/><circle cx="16" cy="18" r="3.5"/><circle cx="25" cy="22" r="2.5"/><circle cx="8" cy="24" r="2"/><path d="M12 11.5l2 3.5M19 9.5l-1.5 5"/></svg>',
  organica:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M16 4l9 5.2v10.4L16 25l-9-5.4V9.2z"/><path d="M16 25v4M25 9.2l3-1.7M7 9.2L4 7.5"/><path d="M11 11.5l5-2.9 5 2.9" opacity=".6"/></svg>',
  tabla:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="6" height="6" rx="1"/><rect x="23" y="5" width="6" height="6" rx="1"/><rect x="3" y="13" width="6" height="6" rx="1"/><rect x="11" y="13" width="5" height="6" rx="1"/><rect x="18" y="13" width="5" height="6" rx="1"/><rect x="23" y="13" width="6" height="6" rx="1"/><rect x="7" y="23" width="18" height="4" rx="1"/></svg>',
  enlaces:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="16" r="5"/><circle cx="24" cy="16" r="5"/><path d="M13 14h6M13 18h6"/></svg>',
  reacciones:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v8L5 25a2 2 0 0 0 1.8 3h18.4a2 2 0 0 0 1.8-3l-7-13V4"/><path d="M10 4h12M8.5 20h15"/><circle cx="14" cy="24" r="1"/><circle cx="19" cy="23" r="1.3"/></svg>',
  disoluciones:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6h18l-2 21H9z"/><path d="M8 15c3 2 5-2 8 0s5 2 8 0"/><circle cx="13" cy="21" r="1"/><circle cx="18" cy="23" r="1"/><circle cx="17" cy="19" r="1"/></svg>',
  materia:'<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="18" width="9" height="9" rx="1"/><path d="M14 27c0-5 3-6 5-9 2 3 5 4 5 9z"/><circle cx="9" cy="8" r="2"/><circle cx="17" cy="6" r="1.5"/><circle cx="24" cy="10" r="2"/></svg>'
};
const TEMAS = [
  ['gases', 'El mundo de los gases', 'gases.html'],
  ['organica', 'Orgánica'],
  ['tabla', 'La tabla periódica'],
  ['enlaces', 'Enlaces químicos'],
  ['reacciones', 'Reacciones químicas'],
  ['disoluciones', 'Disoluciones'],
  ['materia', 'La materia']
];
document.getElementById('temas').innerHTML = TEMAS.map(([k, t, url]) =>
  '<a class="tema' + (url ? ' on' : '') + '" href="' + (url || 'construccion.html?tema=' + encodeURIComponent(t)) + '">' +
  '<span class="ic" aria-hidden="true">' + I[k] + '</span><h2>' + t + '</h2>' +
  '<span class="st">' + (url ? 'Disponible' : 'En construcción') + '</span></a>').join('');
</script>
</body>
</html>
